name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: install zsh and plugins for the PTY tests (a distribution build of zsh)
        run: sudo apt-get update && sudo apt-get install -y zsh zsh-syntax-highlighting zsh-autosuggestions
      - run: go vet ./...
      - run: go test -race ./...
        env:
          ECDY_TEST_ZSH_SYNTAX_HIGHLIGHTING: /usr/share/zsh-syntax-highlighting/zsh-syntax-highlighting.zsh
          ECDY_TEST_ZSH_AUTOSUGGESTIONS: /usr/share/zsh-autosuggestions/zsh-autosuggestions.zsh
      - name: classify cold-start budget (p99 < 15 ms)
        run: go test ./cmd/ecdy -run TestClassifyColdStart -v
        env:
          ECDY_COLDSTART: "1"
      - run: go test ./internal/classify -run '^$' -fuzz FuzzClassify -fuzztime 30s
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - run: nix flake check
      - run: nix build
      - run: ./result/bin/ecdy version
      # PTY tests against every supported zsh release (nix/zsh-versions.nix);
      # the go job covers a distribution-built zsh from apt.
      - run: nix develop .#zsh-matrix -c go test ./...
