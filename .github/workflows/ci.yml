name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Code checks. Every step runs in the zsh-matrix devShell, the same
  # environment as locally: the pinned Go toolchain and golangci-lint, and
  # the PTY tests run against every supported zsh (nix/zsh-versions.nix).
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: nix develop .#zsh-matrix -c bash -e {0}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      # Caches store paths that cache.nixos.org does not have (zsh 5.8.1 and
      # 5.9 from nix/zsh-versions.nix, the ecdy build) in the GitHub Actions
      # cache. FlakeHub and the vendor's diagnostics endpoint are off.
      - uses: DeterminateSystems/magic-nix-cache-action@v15
        with:
          use-gha-cache: true
          use-flakehub: false
          diagnostic-endpoint: ""
      - run: go vet ./...
      - run: go test -race ./...
      - name: classify cold-start budget (p99 < 15 ms)
        run: go test ./cmd/ecdy -run TestClassifyColdStart -v
        env:
          ECDY_COLDSTART: "1"
      - run: go test ./internal/classify -run '^$' -fuzz FuzzClassify -fuzztime 30s
      - run: golangci-lint run

  # Packaging: the flake evaluates, and the package builds and runs.
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: DeterminateSystems/magic-nix-cache-action@v15
        with:
          use-gha-cache: true
          use-flakehub: false
          diagnostic-endpoint: ""
      - run: nix flake check
      - run: nix build
      - run: ./result/bin/ecdy version
